name: サーバーの処理を更新する

# Supabase に表と権限(supabase/schema.sql)を入れ、対局の判定をする Edge Function「game」をデプロイする。
# 最初の1回は「Actions」タブから手で動かす。そのあとはルールのファイルを変えて push すると自動で動く。
# 必要なもの: リポジトリの Secrets に SUPABASE_ACCESS_TOKEN(Supabase のアクセストークン)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/engine.js'
      - 'js/scoring.js'
      - 'js/cards.js'
      - 'js/serverlogic.js'
      - 'supabase/**'
      - 'tools/copy_function_lib.sh'
      - '.github/workflows/deploy-server.yml'

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  PROJECT_REF: aivkyyfdwpurhfiglazp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: アクセストークンがあるか確かめる
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Secrets に SUPABASE_ACCESS_TOKEN がありません。README の手順で登録してください"
            exit 1
          else
            echo "::notice::SUPABASE_ACCESS_TOKEN がまだ無いので、デプロイは飛ばしました"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: ルールのテスト
        if: steps.check.outputs.ok == 'true'
        working-directory: tests
        run: |
          node scoring.test.mjs
          node server.test.mjs

      - name: 表と権限を入れる(schema.sql)
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          jq -n --rawfile q supabase/schema.sql '{query: $q}' > /tmp/query.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/query.json)
          echo "HTTP $code"
          if [ "$code" -ge 300 ]; then
            cat /tmp/out.json
            echo "::error::schema.sql を入れられませんでした。Supabase の SQL Editor に貼って Run しても同じです"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest

      - name: Edge Function「game」をデプロイ
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          sh tools/copy_function_lib.sh
          supabase functions deploy game --project-ref "$PROJECT_REF" --no-verify-jwt
